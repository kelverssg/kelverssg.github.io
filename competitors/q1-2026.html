function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function checkPw(){
  var pw=document.getElementById('pw').value;
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:100000,hash:'SHA-256'},km,{name:'AES-CBC',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-CBC',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));
    document.getElementById('content').innerHTML=new TextDecoder().decode(plain);
    document.getElementById('gate').style.display='none';
    document.getElementById('content').style.display='block';
  }catch(e){
    var err=document.getElementById('err');
    err.style.display='block';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')checkPw();});
</script>
