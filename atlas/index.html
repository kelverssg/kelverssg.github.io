const b2sb = b => Uint8Array.from(atob(b), c=>c.charCodeAt(0));
async function unlock(){
  const err=document.getElementById("err"),btn=document.getElementById("go");
  err.textContent=""; btn.disabled=true;
  try{
    const pb = new TextEncoder().encode(document.getElementById("pw").value);
    const base = await crypto.subtle.importKey("raw", pb, "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b2sb(P.salt), iterations:150000, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt(
      {name:"AES-GCM", iv:b2sb(P.iv), additionalData:new TextEncoder().encode("kelvers-atlas-v1")},
      key, b2sb(P.ct));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(e){
    err.textContent = "口令不正確 · Incorrect passphrase";
    btn.disabled=false;
  }
}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
